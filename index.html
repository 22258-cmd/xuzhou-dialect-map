<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>管！徐州 · 徐州方言数字地图</title>
<meta name="description" content="徐州方言数字交互地图：10 个区县、20 处方言点，可旋转的 3D 彭城。">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="features/quiz.css">
</head>
<body>

<canvas id="scene"></canvas>
<div class="grain"></div>
<div class="vignette"></div>

<!-- ================= 顶栏 ================= -->
<header class="topbar">
  <div class="brand">
    <div class="brand-mark"><span>管</span></div>
    <div class="brand-txt">
      <h1>管！徐州</h1>
      <p>徐州方言数字地图<span class="dot">·</span>Dialect Atlas of Xuzhou</p>
    </div>
  </div>

  <div class="searchbox" id="searchBox">
    <svg class="ic-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21" stroke-linecap="round"/></svg>
    <input id="searchInput" type="text" placeholder="搜区县、方言点、方言词…" autocomplete="off" spellcheck="false">
    <kbd>/</kbd>
    <button class="clear" id="searchClear" hidden aria-label="清空">×</button>
    <div class="sug" id="sug"></div>
  </div>

  <div class="values">
    <div class="v-card">
      <div class="v-label">方言值</div>
      <div class="v-num" id="vValue">0</div>
    </div>
    <div class="v-card">
      <div class="v-label">等级</div>
      <div class="v-num small" id="vLevel">萌新</div>
    </div>
  </div>
</header>

<!-- ================= 图例 ================= -->
<aside class="legend">
  <div class="lg-title">方言点类型</div>
  <div class="lg-list" id="legendList"></div>
  <div class="lg-progress">
    <div class="lgp-head"><span>探索进度</span><b id="progText">0 / 20</b></div>
    <div class="lgp-bar"><i id="progBar"></i></div>
  </div>
</aside>

<!-- ================= 浮动图标层 ================= -->
<div class="pin-layer" id="pinLayer"></div>

<!-- ================= 工具条 ================= -->
<div class="toolbar">
  <button class="tb" id="btnRotate" data-tip="自动旋转">
    <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66" stroke-linecap="round"/><path d="M20 3v5h-5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="tb" id="btnReset" data-tip="复位视角">
    <svg viewBox="0 0 24 24"><path d="M4 12V5h7M20 12v7h-7" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 12a8 8 0 0 0 13.66 5.66M20 12A8 8 0 0 0 6.34 6.34" stroke-linecap="round" opacity=".45"/></svg>
  </button>
  <button class="tb" id="btnChallenge" data-tip="方言挑战">
    <svg viewBox="0 0 24 24"><path d="M12 3l2.4 5.2 5.6.7-4.2 3.9 1.1 5.6L12 15.6 7.1 18.4l1.1-5.6L4 8.9l5.6-.7z" stroke-linejoin="round"/></svg>
  </button>
  <button class="tb" id="btnBook" data-tip="方言图鉴">
    <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v18H6.5A2.5 2.5 0 0 0 4 23z" stroke-linejoin="round"/><path d="M8 8h7M8 12h5" stroke-linecap="round" opacity=".6"/></svg>
  </button>
</div>

<!-- ================= 底部区县 ================= -->
<nav class="district-bar">
  <div class="db-inner" id="districtBar"></div>
</nav>

<!-- ================= 详情面板 ================= -->
<aside class="panel" id="panel">
  <button class="panel-close" id="panelClose" aria-label="关闭">×</button>
  <div class="panel-body" id="panelBody"></div>
</aside>

<!-- ================= 模态 ================= -->
<div class="modal" id="modal"><div class="modal-card" id="modalCard"></div></div>
<div class="toast" id="toast"></div>
<div class="hint" id="hint">拖拽旋转 · 滚轮缩放 · 点击区县进入</div>

<!-- ================= 方言小游戏 stage ================= -->
<div class="stage" id="stage"></div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="data/geo.xuzhou.js"></script>
<script src="data/atlas.js"></script>
<script src="core/store.js"></script>
<script src="core/router.js"></script>
<script src="features/quiz.js"></script>
<script src="js/app.js"></script>
</body>
</html>
